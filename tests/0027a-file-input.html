<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>test: file input (single selection, any type)</title>
</head>
<body>
  <input type="file" />
  <div><img /></div>
  <script>
    const $input = document.querySelector('input')
    const $img   = document.querySelector('img')

    $input.onchange = () => {
      const [file] = $input.files
      if (file) {
        $img.src = URL.createObjectURL(file)
      }
    }
  </script>
</body>
</html>
